Identifier: eos2egp
Slug: chelating-groups
Status: Ready
Title: Chelator fragment identification
Description: Checks a molecule against 55 SMARTS patterns describing chelating groups
  known to sequester metal ions, returning a flag for each and a total count. Chelators
  are a recurring source of false positives in screening, since binding the catalytic
  metal of a metalloprotein produces apparent inhibition of almost any such target.
  The rules derive from work by Agrawal and colleagues and are implemented within
  ChemFH. Matching is purely substructural and does not confirm that chelation occurs
  under assay conditions.

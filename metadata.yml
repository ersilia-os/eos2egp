Identifier: eos2egp
Slug: chelating-groups
Status: Ready
Title: Chelator fragment identification
Description: Checks a molecule against 55 SMARTS patterns describing chelating groups
  that bind metal ions, among them picolinic acids, hydroxyquinolines, hydroxypyrimidines,
  hydroxypyranones, HOPO and HOPTO derivatives, salicylic acids, catechols, sulfonamides
  and beta-diketones, and returns a flag for each plus a total count. The patterns
  codify the chelator fragment libraries of Agrawal and colleagues, screened against
  three matrix metalloproteinases and anthrax lethal factor, and ship with ChemFH
  as a frequent-hitter alert. Matching is substructural and does not prove chelation
  occurs in an assay.
